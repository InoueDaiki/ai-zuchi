[package]
name = "zuchi-llm"
description = "Llm の Ollama 実装。通信先は手元の Ollama だけ"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zuchi-core = { path = "../zuchi-core" }
# 手元との平文 HTTP だけなので TLS は入れない
ureq = { version = "3.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
